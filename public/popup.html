<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extension Starter</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Chrome extension</p>
      <h1>Extension Starter</h1>

      </p>
      <button id="inspect" type="button">Inspect active tab</button>
    </main>
  </body>
</html>
